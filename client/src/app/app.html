<h1>JAAKD Login</h1>

<input 
  type="email"
  [(ngModel)]="email"
  placeholder="Email"
/>

<input
  type="password"
  [(ngModel)]="password"
  placeholder="Password"
/>

<input
  type="text"
  [(ngModel)]="fullName"
  placeholder="Full Name"
/>

<button
  type="button"
  (click)="login()"
>
  Login
</button>
<button
  type="button"
  (click)="signUp()"
>
  Create Account
</button>
<button
  type="button"
  (click)="logout()"
>
  Sign out
</button>



<p>{{ message() }}</p>
