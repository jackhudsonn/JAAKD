<main class="page-content">
  <h1>Transact</h1>

  <h1>
    Transact
  </h1>

  <p class="page-description">
    Deposit or withdraw funds and review your transaction history.
  </p>

  <div class="transact-tabs" role="tablist">
    <button
      type="button"
      class="tab-btn"
      role="tab"
      [class.active]="activeTab() === 'deposit'"
      [attr.aria-selected]="activeTab() === 'deposit'"
      (click)="setTab('deposit')"
    >
      Deposit
    </button>

    <button
      type="button"
      class="tab-btn"
      role="tab"
      [class.active]="activeTab() === 'withdrawal'"
      [attr.aria-selected]="activeTab() === 'withdrawal'"
      (click)="setTab('withdrawal')"
    >
      Withdrawal
    </button>
  </div>

  <section class="transact-forms">
    <div class="form-slot" [class.active]="activeTab() === 'deposit'">
      <app-deposit-form (submitted)="onDeposit($event)" />
    </div>

    <div class="form-slot" [class.active]="activeTab() === 'withdrawal'">
      <app-withdrawal-form (submitted)="onWithdrawal($event)" />
    </div>
  </section>

  <app-transaction-history [transactions]="transactions()" />

</main>
