<app-form-card title="Withdraw Funds" subtitle="Move money out of your account">

  <div class="form-field">
    <label for="withdrawal-amount">Amount (USD)</label>
    <input
      id="withdrawal-amount"
      type="number"
      min="0"
      step="0.01"
      placeholder="0.00"
      [(ngModel)]="amount"
    />
  </div>

  <div class="form-field">
    <label for="withdrawal-method">Payment Method</label>
    <select id="withdrawal-method" [(ngModel)]="method">
      <option value="bank_transfer">Bank Transfer</option>
      <option value="card">Debit/Credit Card</option>
      <option value="crypto_wallet">Crypto Wallet</option>
    </select>
  </div>

  @if (error()) {
    <p class="form-error">{{ error() }}</p>
  }

  <button type="button" class="btn btn-secondary form-submit" (click)="submit()">Withdraw</button>

</app-form-card>
