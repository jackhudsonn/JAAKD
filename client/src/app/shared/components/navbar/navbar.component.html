<header class="app-header authenticated-header">
  <div class="app-brand">JAAKD<span>+</span></div>

  <nav class="app-nav" aria-label="Main navigation">
    <a routerLink="/dashboard" routerLinkActive="active"> Dashboard </a>

    <a routerLink="/transactions" routerLinkActive="active"> Transactions </a>

    <a routerLink="/analytics" routerLinkActive="active"> Analytics </a>

    <div class="menu-wrapper">
      <button
        type="button"
        class="nav-more-button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
        aria-label="More navigation"
      >
        <span>More</span>
        <span class="chevron" [class.open]="menuOpen()"></span>
      </button>

      @if (menuOpen()) {
        <div class="nav-dropdown" role="menu" aria-label="More navigation links">
          <a routerLink="/dashboard" routerLinkActive="active" role="menuitem" (click)="closeMenu()"> Dashboard </a>

          <a routerLink="/transactions" routerLinkActive="active" role="menuitem" (click)="closeMenu()"> Transactions </a>

          <a routerLink="/analytics" routerLinkActive="active" role="menuitem" (click)="closeMenu()"> Analytics </a>
        </div>
      }
    </div>
  </nav>

  <div class="profile-end">
    <div class="avatar-menu-wrapper">
      <button
        type="button"
        class="avatar-button"
        (click)="toggleAvatarMenu()"
        [attr.aria-expanded]="avatarOpen()"
        aria-haspopup="menu"
        aria-label="Account menu"
      >
        <div class="account-avatar" aria-hidden="true">
          {{ displayInitial }}
        </div>
      </button>

      @if (avatarOpen()) {
        <div class="avatar-dropdown" role="menu" aria-label="Account menu">
          <div class="avatar-dropdown-ident">
            <div class="avatar-dropdown-name">{{ displayName }}</div>

            <div class="avatar-dropdown-email">{{ user?.email }}</div>
          </div>

          <div class="avatar-dropdown-actions">
            <button
              type="button"
              class="dropdown-signout"
              (click)="logoutClicked.emit(); closeAvatarMenu()"
            >
              Sign Out
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>
