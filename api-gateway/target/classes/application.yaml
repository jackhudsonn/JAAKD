server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: order-service
            uri: http://localhost:8081
            predicates:
              - Path=/orders/**

          - id: user-service
            uri: http://localhost:8082
            predicates:
              - Path=/users/**

          - id: transaction-service
            uri: http://localhost:8083
            predicates:
              - Path=/transactions/**

management:
  endpoints:
    web:
      exposure:
        include: health, info