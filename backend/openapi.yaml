components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: jaakd_session
      description: Opaque session cookie issued by POST /api/auth/login; the browser never holds a token

  parameters:
    HoldingId:
      name: holdingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LogOrderId:
      name: logOrderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WatchlistId:
      name: watchlistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListItemId:
      name: listItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentMethodId:
      name: paymentMethodId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Ticker:
      name: ticker
      in: path
      required: true
      schema:
        type: string
        maxLength: 20
      example: AAPL

  responses:
    BadRequest:
      description: Malformed request - failed validation (details lists each bad field)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-09-23T14:30:00Z"
            message: Validation failed
            details:
              currentQuantity: Current quantity must be greater than 0
    Unauthorized:
      description: Missing, expired or invalid session. Returned as structured `ErrorResponse` JSON by security handlers.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-10-14T13:30:00Z"
            message: Unauthorized
            details: {}
    ChallengeRequired:
      description: |
        The identity provider requires another step before a session is created.
        `challenge` names the step; `continuation` carries the opaque state to
        submit with the follow-up call. V1 has no challenge completion UI.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChallengeResponse"
          example:
            challenge: MFA
            continuation: opaque-continuation-token
    EmailNotConfirmed:
      description: The credentials are valid but the email address is not confirmed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-10-20T13:30:00Z"
            message: email address is not confirmed
            details:
              code: EMAIL_NOT_CONFIRMED
              email: joanna@example.com
    TooManyRequests:
      description: The identity provider throttled the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-10-20T13:30:00Z"
            message: too many authentication requests; try again later
            details: null
    Forbidden:
      description: Authenticated but not authorized for this operation. Returned as structured `ErrorResponse` JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-09-23T14:30:00Z"
            message: Admin or auditor user type is required
            details: {}
    NotFound:
      description: Resource does not exist, or is not owned by the signed-in user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-09-23T14:30:00Z"
            message: Holding not found
            details: {}
    Conflict:
      description: Request conflicts with current resource state (duplicate or guarded operation)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Unexpected error - generic message only, no stack trace
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        details:
          anyOf:
            - type: object
              additionalProperties:
                type: string
            - type: "null"

    # ---- auth
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 99
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        dob:
          type: string
          format: date
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        zipCode:
          type: string
          maxLength: 10
    RegistrationResponse:
      type: object
      required: [status, email, registrationId]
      properties:
        status:
          type: string
          enum: [REGISTERED, CONFIRMATION_REQUIRED]
        email:
          type: string
          format: email
        registrationId:
          type: string
          format: uuid
    ConfirmRegistrationRequest:
      type: object
      required: [registrationId, code]
      properties:
        registrationId:
          type: string
          format: uuid
        code:
          type: string
    ResendRegistrationRequest:
      type: object
      required: [registrationId]
      properties:
        registrationId:
          type: string
          format: uuid
    ChallengeResponse:
      type: object
      required: [challenge, continuation]
      properties:
        challenge:
          type: string
        continuation:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
          maxLength: 99

    # ---- enums
    InstrumentClass:
      type: string
      enum: [ETF, EQUITY, CASH, CRYPTO]
    OrderSide:
      type: string
      enum: [BUY, SELL, DEPOSIT, WITHDRAW]
    OrderStatus:
      type: string
      enum:
        [SUBMITTED, PENDING, CANCELLED, ACCEPTED, REJECTED, EXECUTED, FAILED]

    # ---- holdings
    HoldingResponse:
      type: object
      description: Projection row for one portfolio + instrument pair. For the dedicated cash instrument, currentQuantity represents cash balance.
      properties:
        holdingID:
          type: string
          format: uuid
        portfolioID:
          type: string
          format: uuid
        instrumentID:
          type: string
          format: uuid
        currentQuantity:
          type: number
          format: double
          description: Current projected quantity. For cash instrument holdings, this is cash balance.
        cumulativeRealizedPnl:
          type: number
          format: double
          description: Cumulative realized PnL from SELL executions matched against FIFO lots. Typically unchanged for cash holdings.
        updatedAt:
          type: string
          format: date-time
          description: Last projection update timestamp.

    PositionLotResponse:
      type: object
      description: One FIFO BUY lot attached to a holding.
      properties:
        positionLotId:
          type: string
          format: uuid
        holdingId:
          type: string
          format: uuid
        sourceBuyLogOrderId:
          type: string
          format: uuid
        openedAt:
          type: string
          format: date-time
        originalQuantity:
          type: number
          description: Original BUY quantity for this lot.
        remainingQuantity:
          type: number
          description: Remaining open quantity after SELL matches.
        unitCost:
          type: number
          description: Executed BUY unit price used as cost basis.

    LotMatchResponse:
      type: object
      description: One FIFO SELL-to-BUY match slice for a holding.
      properties:
        lotMatchId:
          type: string
          format: uuid
        sellLogOrderId:
          type: string
          format: uuid
        positionLotId:
          type: string
          format: uuid
        holdingId:
          type: string
          format: uuid
        matchedQuantity:
          type: number
          description: Quantity consumed from the matched BUY lot.
        sellUnitPrice:
          type: number
          description: Executed SELL unit price.
        realizedPnlAmount:
          type: number
          description: Realized PnL for this match slice.
        matchedAt:
          type: string
          format: date-time

    PortfolioReconciliationResponse:
      type: object
      properties:
        portfolioId:
          type: string
          format: uuid
        executedLogCount:
          type: integer
        holdingCount:
          type: integer
        mismatchCount:
          type: integer
        hasMismatches:
          type: boolean
        mismatches:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationMismatchResponse"

    ReconciliationMismatchResponse:
      type: object
      properties:
        instrumentId:
          type: [string, "null"]
          format: uuid
        expectedQuantity:
          type: [number, "null"]
          format: double
        actualQuantity:
          type: [number, "null"]
          format: double
        expectedCumulativeRealizedPnl:
          type: [number, "null"]
          format: double
        actualCumulativeRealizedPnl:
          type: [number, "null"]
          format: double
        reason:
          type: string

    # ---- instruments
    CreateInstrumentRequest:
      type: object
      required: [ticker, market, name, instrumentClass]
      properties:
        ticker:
          type: string
          minLength: 1
          maxLength: 20
        market:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 255
        instrumentClass:
          $ref: "#/components/schemas/InstrumentClass"
        logoUrl:
          type: [string, "null"]
          maxLength: 1000
        description:
          type: [string, "null"]
          maxLength: 4000
    UpdateInstrumentRequest:
      type: object
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
        logoUrl:
          type: [string, "null"]
          maxLength: 1000
        description:
          type: [string, "null"]
          maxLength: 4000
    InstrumentResponse:
      type: object
      properties:
        instrumentId:
          type: string
          format: uuid
        ticker:
          type: string
        market:
          type: string
        name:
          type: string
        instrumentClass:
          $ref: "#/components/schemas/InstrumentClass"
        logoUrl:
          type: [string, "null"]
        description:
          type: [string, "null"]
    InstrumentPriceResponse:
      type: object
      properties:
        instrumentId:
          type: string
          format: uuid
        ticker:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
        quotedAt:
          type: string
          format: date-time
    QuoteResponse:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: [number, "null"]
          format: double
        bid:
          type: [number, "null"]
          format: double
        ask:
          type: [number, "null"]
          format: double
        currency:
          type: [string, "null"]
        asOf:
          type: [string, "null"]
          format: date-time
        marketState:
          type: [string, "null"]
        changePercent:
          type: [number, "null"]
          format: double
          description: Change since previous close, in percentage points (1.84 means +1.84%)

    AuditUserSearchResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]

    AuditUserSearchPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditUserSearchResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean

    AuditOwnerFields:
      type: object
      description: Owner of the portfolio a row belongs to (portfolio -> profile).
      properties:
        ownerUserId:
          type: [string, "null"]
          format: uuid
        ownerFirstName:
          type: [string, "null"]
        ownerLastName:
          type: [string, "null"]

    AuditOrderLogResponse:
      allOf:
        - $ref: "#/components/schemas/OrderLogResponse"
        - $ref: "#/components/schemas/AuditOwnerFields"

    AuditHoldingResponse:
      allOf:
        - $ref: "#/components/schemas/HoldingResponse"
        - $ref: "#/components/schemas/AuditOwnerFields"

    AuditOrderLogPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditOrderLogResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean

    AuditPortfolioPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean

    AuditHoldingPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditHoldingResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean

    AuditPositionLotPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PositionLotResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean

    AuditLotMatchPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/LotMatchResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasNext:
          type: boolean

    # ---- portfolios
    CreatePortfolioRequest:
      type: object
      required: [portfolioName]
      properties:
        portfolioName:
          type: string
          minLength: 1
          maxLength: 100
    UpdatePortfolioRequest:
      type: object
      required: [portfolioName]
      properties:
        portfolioName:
          type: string
          minLength: 1
          maxLength: 100
    PortfolioResponse:
      type: object
      properties:
        portfolioId:
          type: string
          format: uuid
        portfolioName:
          type: string

    # ---- orders (planned)
    OrderRequest:
      type: object
      required: [instrumentId, side, quantity]
      properties:
        instrumentId:
          type: string
          format: uuid
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: number
          format: double
          exclusiveMinimum: 0
    OrderResponse:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        executionPrice:
          type: [number, "null"]
          format: double
          description: Present only when the order was filled
        reason:
          type: [string, "null"]
          description: Present only when the order was rejected

    # ---- order logs
    CreateOrderLogRequest:
      type: object
      required: [orderId, portfolioId, instrumentId, side, quantity]
      properties:
        orderId:
          type: string
          format: uuid
          description: Shared by every log entry of the same order
        portfolioId:
          type: string
          format: uuid
        instrumentId:
          type: string
          format: uuid
        side:
          $ref: "#/components/schemas/OrderSide"
        quantity:
          type: number
          format: double
          minimum: 0.000001
        metadata:
          type: [string, "null"]
          maxLength: 4000
        executionPrice:
          type: [number, "null"]
          format: double
    CreateDemoOrderLogRequest:
      type: object
      required: [orderId, portfolioId, instrumentId, side, quantity, status, timestamp]
      properties:
        orderId:
          type: string
          format: uuid
        portfolioId:
          type: string
          format: uuid
        instrumentId:
          type: string
          format: uuid
        side:
          $ref: "#/components/schemas/OrderSide"
        quantity:
          type: number
          format: double
          minimum: 0.000001
        status:
          $ref: "#/components/schemas/OrderStatus"
        timestamp:
          type: string
          format: date-time
        metadata:
          type: [string, "null"]
          maxLength: 4000
        executionPrice:
          type: [number, "null"]
          format: double
        quotedPrice:
          type: [number, "null"]
          format: double
    OrderLogResponse:
      type: object
      properties:
        logOrderId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        portfolioId:
          type: string
          format: uuid
        instrumentId:
          type: string
          format: uuid
        side:
          $ref: "#/components/schemas/OrderSide"
        quantity:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
        metadata:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/OrderStatus"
        executionPrice:
          type: number
          format: double
        quotedPrice:
          type: [number, "null"]
          format: double

    # ---- watchlists
    CreateWatchlistRequest:
      type: object
      required: [watchlistName]
      properties:
        watchlistName:
          type: string
          minLength: 1
          maxLength: 255
    UpdateWatchlistRequest:
      type: object
      required: [watchlistName]
      properties:
        watchlistName:
          type: string
          minLength: 1
          maxLength: 255
    CreateWatchlistEntryRequest:
      type: object
      required: [instrumentId]
      properties:
        instrumentId:
          type: string
          format: uuid
    WatchlistResponse:
      type: object
      required: [watchlistId, watchlistName, items]
      properties:
        watchlistId:
          type: string
          format: uuid
        watchlistName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistItemResponse"
    WatchlistItemResponse:
      type: object
