openapi: 3.1.0
info:
  title: JAAKD Trading API
  version: 1.0.0
  description: |
    REST API for the JAAKD direct trading platform (Spring Boot service in `backend/`).

    - Every endpoint requires a valid session cookie (`jaakd_session`); the browser never holds a token.
    - A user can only see and change their own data (BR-02): every query is filtered by the
      authenticated user's ID.
    - All errors share one shape, `ErrorResponse` (see `GlobalExceptionHandler`).
    - Endpoints tagged **Orders** and the **instrument prices** endpoint are planned (contract first)
      and not implemented yet.
  license:
    name: Internal use only
servers:
  - url: http://localhost:8081
    description: Local development server
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: Session auth - register, sign in, session, sign out, change password
  - name: Holdings
    description: A user's current position projection in one instrument, within one portfolio (including the dedicated cash instrument holding)
  - name: Instruments
    description: Tradable assets (reference data shared by all users)
  - name: Portfolios
    description: Portfolios owned by the signed-in user
  - name: OrderLogs
    description: Audit trail - one row per status change of an order (BR-14, BR-15), including privileged diagnostics endpoints
  - name: Watchlists
    description: Instruments a user is watching, per portfolio
  - name: Preferences
    description: Portfolio-scoped user preferences such as dashboard widget order/selection
  - name: PaymentMethods
    description: User-managed bank payment methods for deposits and withdrawals
  - name: Profile
    description: The signed-in user's profile
  - name: Orders
    description: Order placement - PLANNED, not implemented yet (BR-04, BR-05, BR-08, BR-09)

paths:
  # ------------------------------------------------------------------- Auth
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: |
        Creates a credential with the configured identity provider and stores the
        submitted profile. No session is created; confirm the email when required,
        then sign in with `POST /api/auth/login`. Cognito uses an opaque UUID
        username and the email as a verified alias; `registrationId` is that UUID.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: joanna@example.com
              password: correct-horse-battery
              firstName: Joanna
              lastName: Smith
              dob: "1990-04-12"
              city: Boston
              state: MA
              country: USA
              zipCode: "02110"
      responses:
        "201":
          description: Account created; confirmation may be required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/auth/register/confirm:
    post:
      tags: [Auth]
      summary: Confirm a registration email
      description: Confirms the Cognito email verification code for the registration
        identified by `registrationId`. Returns 200 and sets the session cookie when
        Cognito can complete sign-in from the confirmation session; returns 204 when
        the user must sign in separately.
      operationId: confirmRegistration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRegistrationRequest"
      responses:
        "200":
          description: Email confirmed and session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "204":
          description: Email confirmed; sign in separately
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/auth/register/resend:
    post:
      tags: [Auth]
      summary: Resend a registration verification code
      description: Sends a fresh Cognito verification code when the registration is still pending.
      operationId: resendRegistration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendRegistrationRequest"
      responses:
        "204":
          description: Code sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in and start a session
      description: |
        Authenticates with the identity provider, provisions the application user
        and sets the `jaakd_session` cookie. No token is returned. If the provider
        requires another step, the response is `202` with a challenge instead.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: joanna@example.com
              password: correct-horse-battery
      responses:
        "200":
          description: Signed in - the `jaakd_session` cookie is set
          headers:
            Set-Cookie:
              description: "`jaakd_session=<id>; HttpOnly; SameSite=Lax; Path=/` (adds `Secure` when `AUTH_COOKIE_SECURE` is true)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "202":
          $ref: "#/components/responses/ChallengeRequired"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/EmailNotConfirmed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/auth/session:
    get:
      tags: [Auth]
      summary: Get the signed-in user
      description: Confirms the session cookie is valid and returns the signed-in email.
      operationId: getSession
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End the session
      description: Deletes the server-side session and clears the `jaakd_session` cookie.
      operationId: logout
      responses:
        "204":
          description: Signed out - the `jaakd_session` cookie is cleared
          headers:
            Set-Cookie:
              description: "`jaakd_session=; Max-Age=0; Path=/`"
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the signed-in user's password
      description: Changes the credential at the identity provider. Requires an active session.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            example:
              currentPassword: correct-horse-battery
              newPassword: another-correct-horse
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------- Holdings
  /api/holdings/portfolio/{portfolioId}:
    get:
      tags: [Holdings]
      summary: List the holdings in one of the user's portfolios
      description: |
        Returns an empty list if the portfolio does not exist or is not owned by the user.

        Execution projection behavior:
        - BUY and SELL executions update non-cash holdings via FIFO lot accounting.
        - DEPOSIT and WITHDRAW executions update only the cash holding quantity.
        - Position-lot and lot-match rows are exposed via holding sub-resources for owned holdings.
      operationId: getHoldingsByPortfolio
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: Holdings in the portfolio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HoldingResponse"
              example:
                - holdingID: 3f6c1a2e-8b4d-4c1a-9e2f-1a2b3c4d5e6f
                  portfolioID: 9a8b7c6d-5e4f-4a3b-2c1d-0e9f8a7b6c5d
                  instrumentID: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                  currentQuantity: 50
                  cumulativeRealizedPnl: 1150
                  updatedAt: "2026-09-25T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/holdings/portfolio/{portfolioId}/reconcile:
    get:
      tags: [Holdings]
      summary: Reconcile holdings projection against executed order logs
      description: |
        Replays EXECUTED order logs for the portfolio and compares expected values to persisted holdings.
        Includes cash instrument holdings and returns a mismatch summary for diagnostics.
        This diagnostics endpoint is restricted to ADMIN or AUDITOR user types.
      operationId: reconcilePortfolioHoldings
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: Reconciliation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioReconciliationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/holdings/{holdingId}:
    get:
      tags: [Holdings]
      summary: Get one holding
      operationId: getHoldingById
      parameters:
        - $ref: "#/components/parameters/HoldingId"
      responses:
        "200":
          description: The holding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingResponse"
              example:
                holdingID: 3f6c1a2e-8b4d-4c1a-9e2f-1a2b3c4d5e6f
                portfolioID: 9a8b7c6d-5e4f-4a3b-2c1d-0e9f8a7b6c5d
                instrumentID: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                currentQuantity: 50
                cumulativeRealizedPnl: 1150
                updatedAt: "2026-09-25T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Holdings]
      summary: Delete a holding
      operationId: deleteHolding
      parameters:
        - $ref: "#/components/parameters/HoldingId"
      responses:
        "204":
          description: Holding deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/holdings/{holdingId}/position-lots:
    get:
      tags: [Holdings]
      summary: List FIFO position lots for one holding
      description: |
        Returns FIFO BUY lots for one owned holding.
        If the holding is owned and has no position lots, returns an empty list.
      operationId: getPositionLotsByHoldingId
      parameters:
        - $ref: "#/components/parameters/HoldingId"
      responses:
        "200":
          description: Position lots for the holding (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PositionLotResponse"
              example:
                - positionLotId: 31f46f28-0d42-4c19-95de-77561f6fc2c4
                  holdingId: 3f6c1a2e-8b4d-4c1a-9e2f-1a2b3c4d5e6f
                  sourceBuyLogOrderId: 6e8b3bca-9d8a-4028-9d5f-136dca4deec5
                  openedAt: "2026-09-25T09:30:00Z"
                  originalQuantity: 100.00
                  remainingQuantity: 40.00
                  unitCost: 10.50
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/holdings/{holdingId}/lot-matches:
    get:
      tags: [Holdings]
      summary: List FIFO lot matches for one holding
      description: |
        Returns SELL-to-BUY FIFO match slices for one owned holding.
        If the holding is owned and has no lot matches, returns an empty list.
      operationId: getLotMatchesByHoldingId
      parameters:
        - $ref: "#/components/parameters/HoldingId"
      responses:
        "200":
          description: Lot matches for the holding (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LotMatchResponse"
              example:
                - lotMatchId: 0f0d4025-f962-4faf-988a-ec6f71f698c2
                  sellLogOrderId: 4e261f03-c0dc-4653-ae7b-ece8f26d0a9e
                  positionLotId: 31f46f28-0d42-4c19-95de-77561f6fc2c4
                  holdingId: 3f6c1a2e-8b4d-4c1a-9e2f-1a2b3c4d5e6f
                  matchedQuantity: 60.00
                  sellUnitPrice: 11.20
                  realizedPnlAmount: 42.00
                  matchedAt: "2026-09-25T11:15:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # ------------------------------------------------------------- Instruments
  /api/instruments:
    get:
      tags: [Instruments]
      summary: List all instruments
      description: |
        Returns instruments for authenticated users.
        Optional filters:
        - `query`: case-insensitive contains match on ticker or name.
        - `instrumentType`: exact instrument class match.
        Optional paging:
        - `page` (default `0` when paging is used)
        - `size` (default `25`, max `100` when paging is used)
      operationId: getAllInstruments
      parameters:
        - name: instrumentType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InstrumentClass"
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: All instruments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstrumentResponse"
              example:
                - instrumentId: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                  ticker: AAPL
                  market: NASDAQ
                  name: Apple Inc.
                  instrumentClass: EQUITY
                  logoUrl: https://example.com/logos/aapl.png
                  description: Consumer electronics and software
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Instruments]
      summary: Create an instrument
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstrumentRequest"
            example:
              ticker: AAPL
              market: NASDAQ
              name: Apple Inc.
              instrumentClass: EQUITY
              logoUrl: https://example.com/logos/aapl.png
              description: Consumer electronics and software
      responses:
        "201":
          description: Instrument created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/instruments/{instrumentId}:
    get:
      tags: [Instruments]
      summary: Get one instrument by ID
      operationId: getInstrumentById
      parameters:
        - $ref: "#/components/parameters/InstrumentId"
      responses:
        "200":
          description: The instrument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [Instruments]
      summary: Update an instrument's name, logo or description
      description: Ticker, market and class cannot be changed. Null fields are left as they are.
      operationId: updateInstrument
      parameters:
        - $ref: "#/components/parameters/InstrumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstrumentRequest"
            example:
              description: Maker of the iPhone
      responses:
        "200":
          description: Instrument updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Instruments]
      summary: Delete an instrument
      operationId: deleteInstrument
      parameters:
        - $ref: "#/components/parameters/InstrumentId"
      responses:
        "204":
          description: Instrument deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/instruments/ticker/{ticker}:
    get:
      tags: [Instruments]
      summary: Get one instrument by ticker (case-insensitive)
      operationId: getInstrumentByTicker
      parameters:
        - $ref: "#/components/parameters/Ticker"
      responses:
        "200":
          description: The instrument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/instruments/quotes:
    get:
      tags: [Instruments]
      summary: Get live quotes for up to 25 tickers
      description: >
        Proxies Fauxnance `/quotes`. Symbols with no quote are left out of the
        response. Supports BR-12 (price coverage) and BR-13 (indicative price).
      operationId: getQuotesByTickers
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated tickers (max 25)
          schema:
            type: string
          example: NVDA,BTC
      responses:
        "200":
          description: One quote per symbol that Fauxnance priced
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteResponse"
              example:
                - symbol: NVDA
                  price: 118.6
                  bid: 118.55
                  ask: 118.65
                  currency: USD
                  asOf: "2026-10-21T14:30:00Z"
                  marketState: open
                  changePercent: 1.84
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Fauxnance could not be reached or returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/instruments/quotes/{ticker}:
    get:
      tags: [Instruments]
      summary: Get the live quote for one ticker
      description: Proxies Fauxnance `/quotes` for a single symbol.
      operationId: getQuoteByTicker
      parameters:
        - $ref: "#/components/parameters/Ticker"
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
              example:
                symbol: NVDA
                price: 118.6
                bid: 118.55
                ask: 118.65
                currency: USD
                asOf: "2026-10-21T14:30:00Z"
                marketState: open
                changePercent: 1.84
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Fauxnance could not be reached or returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/instruments/prices:
    get:
      tags: [Instruments]
      summary: Find an instrument's price at a point in time (PLANNED)
      description: >
        PLANNED - not implemented yet, and needs a new `instrumentPrices` table.
        Backs the `findInstrumentByNameAndTime` query. Returns the most recent
        quote at or before `at`. Supports BR-08 (price at execution) and BR-13
        (indicative price before submitting).
      operationId: findInstrumentByNameAndTime
      parameters:
        - name: name
          in: query
          required: true
          description: Instrument name or ticker (case-insensitive)
          schema:
            type: string
          example: AAPL
        - name: at
          in: query
          required: true
          description: Point in time to price at (ISO-8601)
          schema:
            type: string
            format: date-time
          example: "2026-09-23T14:30:00Z"
      responses:
        "200":
          description: The instrument and its price at that time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentPriceResponse"
              example:
                instrumentId: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
                ticker: AAPL
                name: Apple Inc.
                price: 227.52
                quotedAt: "2026-09-23T14:29:58Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # -------------------------------------------------------------- Portfolios
  /api/portfolios:
    get:
      tags: [Portfolios]
      summary: List the signed-in user's portfolios
      operationId: getCurrentUserPortfolios
      responses:
        "200":
          description: The user's portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioResponse"
              example:
                - portfolioId: 9a8b7c6d-5e4f-4a3b-2c1d-0e9f8a7b6c5d
                  portfolioName: Long-term
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Portfolios]
      summary: Create a portfolio for the signed-in user
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioRequest"
            example:
              portfolioName: Long-term
      responses:
        "201":
          description: Portfolio created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
              example:
                portfolioId: 9a8b7c6d-5e4f-4a3b-2c1d-0e9f8a7b6c5d
                portfolioName: Long-term
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/portfolios/{portfolioId}:
    get:
      tags: [Portfolios]
      summary: Get one of the user's portfolios
      operationId: getPortfolioById
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "200":
          description: The portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [Portfolios]
      summary: Rename a portfolio
      operationId: updatePortfolio
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePortfolioRequest"
            example:
              portfolioName: Retirement
      responses:
        "200":
          description: Portfolio updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Portfolios]
      summary: Delete a portfolio (and its holdings and watchlists)
      description: >
        Deletion is allowed only when the portfolio is truly empty.
        Returns 409 when active order logs exist (SUBMITTED, PENDING, ACCEPTED)
        or when any holding (including cash) has currentQuantity greater than zero.
      operationId: deletePortfolio
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      responses:
        "204":
          description: Portfolio deleted
        "409":
          description: Portfolio is not empty and cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: "2026-09-23T14:30:00Z"
                message: Cannot delete portfolio with active orders and non-zero holdings
                details:
                  hasActiveOrders: "true"
                  hasNonZeroHoldings: "true"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  # ------------------------------------------------------------------ Orders
  /api/portfolios/{portfolioId}/orders:
    post:
      tags: [Orders]
      summary: Place a buy or sell order (PLANNED)
      description: >
        PLANNED - not implemented yet (OrderService is empty). The order is validated
        against trading rules (BR-05), recorded in orderLogs before execution (BR-06),
        priced against the current quote (BR-08), and on fill the holding, cash balance
        and trade record are updated in one transaction (BR-09).
      operationId: placeOrder
      parameters:
        - $ref: "#/components/parameters/PortfolioId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
            example:
              instrumentId: 1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
              side: BUY
              quantity: 5
      responses:
        "201":
          description: Order accepted and recorded
          headers:
            Location:
              description: URL of the new order's audit trail
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                orderId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                status: EXECUTED
                executionPrice: 227.52
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            Well-formed order rejected by a business rule
            (e.g. insufficient cash, selling more than held, instrument not tradable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                orderId: 8d0f7780-8536-41ef-a55c-f18ad2a01bf8
                status: REJECTED
                reason: cannot sell more than the current holding
        "500":
          $ref: "#/components/responses/ServerError"

