        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/order-logs/{orderId}/cancel:
    post:
      tags: [OrderLogs]
      summary: Cancel a logical order by appending a CANCELLED order-log entry
      description: |
        Append-only cancel behavior:
        - If latest owned status is SUBMITTED or PENDING, append a new CANCELLED order-log row.
        - If latest owned status is already CANCELLED, return that row (idempotent 200).
        - If latest owned status is ACCEPTED, EXECUTED, REJECTED, or FAILED, return 409.
      operationId: cancelOrderByOrderId
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Existing or newly appended CANCELLED order-log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

