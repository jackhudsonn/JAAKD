      summary: Search users for audit workflows
      description: |
        Restricted to ADMIN or AUDITOR user types.
        Case-insensitive search across users.email, profiles.username,
        profiles.firstName, and profiles.lastName.
      operationId: searchAuditUsers
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditUserSearchPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/audit/order-logs:
    get:
      tags: [Audit]
      summary: Search order logs for audit workflows
      description: |
        Restricted to ADMIN or AUDITOR user types.
        If `date` is provided, filtering uses day boundaries:
        - start = date at 00:00 (inclusive)
        - end = next day at 00:00 (exclusive)
        `fromDate` and `toDate` define an optional inclusive date range.
        If provided, date range takes precedence over `date`.
        Optional filters: userId, status, ticker, instrumentId, instrumentType, orderId, latestOnly.
      operationId: searchAuditOrderLogs
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: ticker
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
        - name: instrumentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: instrumentType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InstrumentClass"
        - name: orderId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: latestOnly
          in: query
          required: false
          description: When true, return only the most recent log row per order (one row per order).
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Matching order logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditOrderLogPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/audit/users/{userId}/portfolios:
