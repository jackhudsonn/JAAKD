          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: User portfolios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPortfolioPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/audit/holdings:
    get:
      tags: [Audit]
      summary: List holdings across users (audit)
      description: Restricted to ADMIN or AUDITOR user types.
      operationId: getAuditHoldings
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
