info:
  app:
    name: backend
    description: Backend service for JAAKD

spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties] # loads backend/.env (KEY=value is valid .properties syntax)

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by SQL scripts, never generated from entities
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_schema: public
        globally_quoted_identifiers: true

  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:jaakd-backend}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.github.jackhudsonn.jaakd.event
app:
  cors:
    # Same-origin is the normal case (the dev-server proxy, or a reverse proxy in
    # front of a deployed build); CORS is only exercised by a genuinely
    # cross-origin client. Deployments set this to their own origin.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
identity:
  provider: ${IDENTITY_PROVIDER}
auth:
  session:
    ttl: PT8H
    cookie:
      secure: ${AUTH_COOKIE_SECURE}
springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
server:
    port: 8081

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized