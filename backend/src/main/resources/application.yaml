info:
  app:
    name: backend
    description: Backend service for JAAKD

spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties] # loads backend/.env (KEY=value is valid .properties syntax)

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by SQL scripts, never generated from entities
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_schema: public
        globally_quoted_identifiers: true

  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:jaakd-backend}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.github.jackhudsonn.jaakd.event
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://10.23.135.30:8082}
identity:
  provider: ${IDENTITY_PROVIDER}
auth:
  session:
    ttl: PT8H
    cookie:
      secure: ${AUTH_COOKIE_SECURE}
springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
server:
    port: 8081

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

fauxnance:
  base-url: ${FAUXNANCE_BASE_URL:https://api.fauxnance.local}
  api-key: ${FAUXNANCE_API_KEY:}
  api-key-header: ${FAUXNANCE_API_KEY_HEADER:X-API-Key}
  timeout:
    connect: ${FAUXNANCE_TIMEOUT_CONNECT:PT2S}
    read: ${FAUXNANCE_TIMEOUT_READ:PT4S}
  retry:
    max-attempts: ${FAUXNANCE_RETRY_MAX_ATTEMPTS:3}
    backoff: ${FAUXNANCE_RETRY_BACKOFF:PT0.2S}
  quotes:
    max-batch-size: ${FAUXNANCE_QUOTES_MAX_BATCH_SIZE:25}