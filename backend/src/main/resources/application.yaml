info:
  app:
    name: backend
    description: Backend service for JAAKD

spring:
  application:
    name: backend

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/jaakd}
    username: ${SPRING_DATASOURCE_USERNAME:jaakd_app}
    password: ${SPRING_DATASOURCE_PASSWORD:${JAAKD_APP_DB_PASSWORD:}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by SQL scripts, never generated from entities
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_schema: public
        globally_quoted_identifiers: true

  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:jaakd-backend}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.github.jackhudsonn.jaakd.event
app:
  demo-fixtures:
    enabled: false
  cors:
    # Same-origin is the normal case (the dev-server proxy, or a reverse proxy in
    # front of a deployed build); CORS is only exercised by a genuinely
    # cross-origin client. Deployments set this to their own origin.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
identity:
  provider: ${IDENTITY_PROVIDER}
  cognito:
    region: ${COGNITO_REGION:}
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    client-id: ${COGNITO_CLIENT_ID:}
    client-secret: ${COGNITO_CLIENT_SECRET:}
    api-call-timeout: ${COGNITO_API_CALL_TIMEOUT:PT10S}
    api-call-attempt-timeout: ${COGNITO_API_CALL_ATTEMPT_TIMEOUT:PT5S}
    retry-attempts: ${COGNITO_RETRY_ATTEMPTS:2}
auth:
  session:
    ttl: PT8H
    cookie:
      secure: ${AUTH_COOKIE_SECURE}
springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
server:
  port: 8081

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

fauxnance:
  base-url: ${FAUXNANCE_BASE_URL:https://api.fauxnance.local}
  api-key: ${FAUXNANCE_API_KEY:}
  api-key-header: ${FAUXNANCE_API_KEY_HEADER:X-API-Key}
  cache:
    quote-ttl: ${FAUXNANCE_QUOTE_CACHE_TTL:PT15M}
    symbol-ttl: ${FAUXNANCE_SYMBOL_CACHE_TTL:PT15M}
    candle-ttl: ${FAUXNANCE_CANDLE_CACHE_TTL:PT1M}
    stale-ttl: ${FAUXNANCE_CACHE_STALE_TTL:PT15M}
  timeout:
    connect: ${FAUXNANCE_TIMEOUT_CONNECT:PT10S}
    read: ${FAUXNANCE_TIMEOUT_READ:PT30S}
  retry:
    max-attempts: ${FAUXNANCE_RETRY_MAX_ATTEMPTS:3}
    backoff: ${FAUXNANCE_RETRY_BACKOFF:PT0.2S}
  quotes:
    max-batch-size: ${FAUXNANCE_QUOTES_MAX_BATCH_SIZE:25}

analytics:
  db:
    # Separate read-only Postgres built nightly by analytics/ (dbt). Off by default; the endpoints answer 503 until enabled.
    enabled: ${ANALYTICS_DB_ENABLED:false}
    url: ${ANALYTICS_DB_URL:jdbc:postgresql://localhost:5434/jaakd_analytics}
    username: ${ANALYTICS_DB_USERNAME:analytics_app_reader}
    password: ${ANALYTICS_DB_PASSWORD:}

prices:
  history:
    enabled: ${PRICES_HISTORY_ENABLED:true}
    cron: ${PRICES_HISTORY_CRON:0 0 22 * * *} # UTC: after the US close, before the 22:30 analytics copy
    lookback: ${PRICES_HISTORY_LOOKBACK:5y}
    request-delay: ${PRICES_HISTORY_REQUEST_DELAY:PT1S}
