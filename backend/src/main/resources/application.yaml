info:
  app:
    name: backend
    description: Backend service for JAAKD

spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties] # loads backend/.env (KEY=value is valid .properties syntax)

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by SQL scripts, never generated from entities
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_schema: public
        globally_quoted_identifiers: true

  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://10.23.135.30:8082}
identity:
  provider: ${IDENTITY_PROVIDER:dev}
auth:
  session:
    ttl: PT8H
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
server:
    port: 8081

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized