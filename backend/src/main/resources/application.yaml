info:
  app:
    name: backend
    description: Backend service for JAAKD

spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties] # loads backend/.env (KEY=value is valid .properties syntax)

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Supabase migrations, never generated from entities
    properties:
      hibernate:
        default_schema: public

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json

server:
    port: 8081

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always