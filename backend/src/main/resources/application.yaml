info:
  app:
    name: backend
    description: Backend service for JAAKD

spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties] # loads backend/.env (KEY=value is valid .properties syntax)

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by SQL scripts, never generated from entities
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_schema: public
        globally_quoted_identifiers: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json

  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false

server:
    port: 8081

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized