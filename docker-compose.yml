services:
  jaakd-postgres:
    image: postgres:16
    container_name: jaakd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jaakd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JAAKD_APP_DB_PASSWORD: ${JAAKD_APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jaakd"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jaakd-postgres-data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
      # Development-only credential store; applied by 02-development-credentials.sh
      # and absent in production. Not part of the application schema.
      - ./backend/db/development:/opt/jaakd-development:ro

  jaakd-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jaakd-backend
    restart: unless-stopped
    depends_on:
      jaakd-postgres:
        condition: service_healthy
      jaakd-kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://jaakd-postgres:5432/jaakd
      SPRING_DATASOURCE_USERNAME: jaakd_app
      SPRING_DATASOURCE_PASSWORD: ${JAAKD_APP_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: jaakd-kafka:9092
      IDENTITY_PROVIDER: development
      AUTH_COOKIE_SECURE: "false"
    ports:
      # Bound to all interfaces on purpose: the backend is reached directly by
      # IP from other machines (a remote frontend, pgAdmin, a peer's browser),
      # not only through an SSH tunnel. Development cookies are not Secure, so
      # run this only on a trusted network.
      - "8081:8081"

  jaakd-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: jaakd-frontend
    restart: unless-stopped
    depends_on:
      - jaakd-backend
    environment:
      # proxy.conf.js target; the backend is reached by service name.
      BACKEND_TARGET: http://jaakd-backend:8081
    ports:
      - "4200:4200"
    volumes:
      # Edits on the host are picked up by the dev server.
      - ./frontend:/app
      # Keeps the image's Linux node_modules from being shadowed by the host's.
      - jaakd-frontend-node-modules:/app/node_modules

  jaakd-kafka:
    image: apache/kafka:3.8.0
    container_name: jaakd-kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://jaakd-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@jaakd-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "9092:9092"

volumes:
  jaakd-postgres-data:
    name: jaakd-postgres-data
  jaakd-frontend-node-modules:
    name: jaakd-frontend-node-modules
