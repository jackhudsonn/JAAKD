services:
  jaakd-postgres:
    image: postgres:16
    container_name: jaakd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jaakd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JAAKD_APP_DB_PASSWORD: ${JAAKD_APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jaakd"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jaakd-postgres-data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
      # Development-only credential store; applied by 02-dev-credentials.sh
      # and absent in production. Not part of the application schema.
      - ./backend/db/dev:/opt/jaakd-dev:ro

  jaakd-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jaakd-backend
    restart: unless-stopped
    depends_on:
      jaakd-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://jaakd-postgres:5432/jaakd
      SPRING_DATASOURCE_USERNAME: jaakd_app
      SPRING_DATASOURCE_PASSWORD: ${JAAKD_APP_DB_PASSWORD}
      IDENTITY_PROVIDER: dev
      AUTH_COOKIE_SECURE: "false"
    ports:
      - "8081:8081"

volumes:
  jaakd-postgres-data:
    name: jaakd-postgres-data
