<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-title">{{ site.title }}</h1>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/place-order/' | relative_url }}">Place Order</a>
        <a href="{{ '/view-transactions/' | relative_url }}">View Transactions</a>
        <a href="{{ '/watchlist/' | relative_url }}">Watchlist</a>
        <a href="{{ '/analytics/' | relative_url }}">Analytics</a>
        <a href="{{ '/sign-in/' | relative_url }}">Sign In</a>
      </nav>
    </header>

    <div class="page-shell">
      <aside class="placeholder-aside" aria-label="Left sidebar placeholder">
        <h2>Aside Placeholder A</h2>
        <p>This is a placeholder aside section for future widgets or notes.</p>
      </aside>

      <main class="main-body" aria-label="Main content">
        {{ content }}
      </main>

      <aside class="placeholder-aside" aria-label="Right sidebar placeholder">
        <h2>Aside Placeholder B</h2>
        <p>This is a second placeholder aside section for additional content.</p>
      </aside>
    </div>
  </body>
</html>
