<div class="scrollable-list" [style.min-height]="minHeight()" [style.max-height]="maxHeight()">
  @if (items().length === 0) {
    <p class="scrollable-list-empty">{{ emptyMessage() }}</p>
  } @else {
    @for (item of items(); track trackBy()(item)) {
      <div class="scrollable-list-row">
        <ng-container
          [ngTemplateOutlet]="rowTemplate()"
          [ngTemplateOutletContext]="{ $implicit: item }"
        />
      </div>
    }
  }
</div>
