<section class="card payment-editor">
  <!-- <div class="payment-editor-heading">
    <h2>Add Bank Payment Method</h2>
    <p>Add a bank account for deposits and withdrawals.</p>
  </div> -->

  <div class="form-layout">
    <div class="form-field">
      <label for="bankNickname">Nickname <span class="required-indicator">*</span></label>
      <input id="bankNickname" type="text" [(ngModel)]="bankNickname" placeholder="Primary checking" />
    </div>

    <div class="form-field">
      <label for="bankAccountHolderName">Account Holder Name <span class="required-indicator">*</span></label>
      <input
        id="bankAccountHolderName"
        type="text"
        [(ngModel)]="bankAccountHolderName"
        placeholder="Jane Doe"
      />
    </div>

    <div class="form-field">
      <label for="bankName">Bank Name <span class="required-indicator">*</span></label>
      <input id="bankName" type="text" [(ngModel)]="bankName" placeholder="Example National Bank" />
    </div>

    <div class="form-field">
      <label for="bankAccountType">Account Type</label>
      <select id="bankAccountType" [(ngModel)]="bankAccountType">
        <option value="checking">Checking</option>
        <option value="savings">Savings</option>
      </select>
    </div>

    <div class="form-field">
      <label for="routingNumber">Routing Number <span class="required-indicator">*</span></label>
      <input
        id="routingNumber"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        [(ngModel)]="bankRoutingNumber"
        placeholder="9 digits"
      />
    </div>

    <div class="form-field">
      <label for="accountNumber">Account Number <span class="required-indicator">*</span></label>
      <input
        id="accountNumber"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        [(ngModel)]="bankAccountNumber"
        placeholder="4-17 digits"
      />
    </div>
  </div>

  @if (formError()) {
    <p class="form-error">{{ formError() }}</p>
  }

  @if (statusMessage()) {
    <p class="status-message">{{ statusMessage() }}</p>
  }

  <div class="payment-actions">
    <button type="button" class="btn btn-primary" [disabled]="submitting()" (click)="addMethod()">
      @if (submitting()) {
        Saving...
      } @else {
        Add Method
      }
    </button>

    <button type="button" class="btn btn-secondary" [disabled]="submitting()" (click)="showSavedMethods()">
      View Methods
    </button>
  </div>
</section>

@if (showingSavedMethods()) {
  <app-saved-methods-popup (closed)="closeSavedMethods()" />
}
