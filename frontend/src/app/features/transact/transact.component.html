<main class="page-content transact-page">
  <!-- <h1>Transact</h1> -->

  <p class="page-description">Deposit or withdraw funds and review your transaction history.</p>

  @if (loadState() === 'loading') {
    <section class="transact-forms" aria-busy="true">
      <div class="top-slot">
        <app-widget-card title="Move Funds" status="loading" />
      </div>

      <div class="top-slot">
        <app-widget-card title="Currency Exchange" status="loading" />
      </div>

      <div class="history-slot">
        <app-widget-card title="Transaction History" status="loading" />
      </div>
    </section>
  } @else if (loadState() === 'error') {
    <p class="page-description">We couldn't load your transact data. Try again.</p>
    <button type="button" class="btn btn-secondary" (click)="retryLoad()">Retry</button>
  } @else {
    <section class="transact-forms">
      <div class="top-slot">
        <app-move-funds-form
          [submitting]="submittingAction()"
          [currencies]="currencies()"
          (depositSubmitted)="onDeposit($event)"
          (withdrawalSubmitted)="onWithdrawal($event)"
        />
      </div>

      <div class="top-slot">
        <app-currency-exchange
          [balances]="cashBalances()"
          [currencies]="currencies()"
          [submitting]="submittingAction()"
          (exchangeSubmitted)="onExchange($event)"
        />
      </div>

      <div class="history-slot">
        <app-transaction-history
          [transactions]="transactions()"
          (selectTransaction)="openTransactionDetails($event)"
        />
      </div>
    </section>
  }

  @if (activeTransaction(); as transaction) {
    <app-transaction-details-popup
      [transaction]="transaction"
      [cancelling]="submittingAction()"
      (closed)="closeTransactionPopup()"
      (cancel)="cancelTransaction($event)"
    />
  }
</main>
