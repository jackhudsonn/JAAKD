<app-widget-card class="transaction-history-card" title="Transaction History">
  <div class="transaction-columns" role="row">
    <span class="column-label">Date</span>
    <span class="column-label">Type</span>
    <span class="column-label">Amount</span>

    <span class="column-label">Method</span>
    <span class="column-label">Status</span>
  </div>

  <app-scrollable-list [items]="rows()" [trackBy]="trackById" emptyMessage="No transactions yet.">
    <ng-template let-transaction>
      <div class="transaction-row">
        <span class="transaction-date">{{ transaction.createdAt | date: 'MMM d, y' }}</span>

        <span
          class="transaction-type"
          [class.deposit]="transaction.type === 'deposit'"
          [class.withdrawal]="transaction.type === 'withdrawal'"
          [class.exchange]="transaction.type === 'exchange'"
        >
          {{ formatLabel(transaction.type) }}
        </span>

        <span class="transaction-amount">{{
          transaction.amount | currency: transaction.currency ?? 'USD'
        }}</span>
        <span class="transaction-method">
          {{
            transaction.type === 'exchange'
              ? transaction.typeLabel
              : formatLabel(transaction.method)
          }}
        </span>
        <app-status-badge [status]="transaction.status" />
      </div>
    </ng-template>
  </app-scrollable-list>
</app-widget-card>
