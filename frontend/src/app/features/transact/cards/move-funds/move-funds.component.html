<app-widget-card title="Move Funds">
  <div class="form-field">
    <label for="funds-currency">Currency</label>

    <select id="funds-currency" [(ngModel)]="selectedCurrency" [disabled]="submitting()">
      @for (currency of currencies(); track currency) {
        <option [value]="currency">{{ currency }}</option>
      }
    </select>
  </div>

  <div class="form-field">
    <label for="funds-amount">Amount</label>
    <input
      id="funds-amount"
      type="number"
      min="0"
      step="0.01"
      placeholder="0.00"
      [(ngModel)]="amount"
      [disabled]="submitting()"
    />
  </div>

  <div class="form-field">
    <label for="funds-method">Payment Method</label>

    <select
      id="funds-method"
      [(ngModel)]="selectedMethodId"
      (ngModelChange)="onMethodSelectionChange()"
      [disabled]="submitting()"
    >
      <option value="" disabled>Select a payment method</option>

      @for (option of paymentOptions(); track option.id) {
        <option [value]="option.id">{{ option.label }}</option>
      }

      <option value="__add_method__">Add +</option>
    </select>
  </div>

  <div class="action-row">
    <button
      type="button"
      class="btn btn-secondary"
      [disabled]="submitting()"
      (click)="submit('withdrawal')"
    >
      Withdraw
    </button>

    <button
      type="button"
      class="btn btn-primary"
      [disabled]="submitting()"
      (click)="submit('deposit')"
    >
      Deposit
    </button>
  </div>
</app-widget-card>

@if (pendingAction(); as pendingAction) {
  <app-modal
    [title]="pendingAction.action === 'deposit' ? 'Confirm Deposit' : 'Confirm Withdrawal'"
    (closed)="cancelAction()"
  >
    <p class="confirm-copy">
      @if (pendingAction.action === 'deposit') {
        Deposit {{ pendingAction.amount }} {{ pendingAction.currency }} into your account?
      } @else {
        Withdraw {{ pendingAction.amount }} {{ pendingAction.currency }} from your account?
      }
    </p>

    <app-confirm-actions
      [confirmLabel]="submitting() ? 'Submitting...' : 'Confirm'"
      (cancelled)="cancelAction()"
      (confirmed)="confirmAction()"
    />
  </app-modal>
}
