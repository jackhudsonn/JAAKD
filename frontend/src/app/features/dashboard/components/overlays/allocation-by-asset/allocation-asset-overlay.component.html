@if (asset(); as selectedAsset) {
  <app-asset-summary-overlay [asset]="selectedAsset" (closed)="closed.emit()">
    <p class="allocation-line">
      <span>Holding Value</span>
      <strong>{{ formatCurrency(selectedAsset.value, selectedAsset.currency) }}</strong>
    </p>
    <p class="allocation-line">
      <span>Estimated Units</span>
      <strong>{{ selectedAsset.estimatedUnits | number: '1.2-4' }}</strong>
    </p>

    <div class="allocation-actions">
      <button type="button" class="btn btn-primary" (click)="tradeRequested.emit()">Trade</button>
    </div>
  </app-asset-summary-overlay>
}
