@if (watchlistDialogMode() === 'create') {
  <app-modal title="Create Watchlist" (closed)="closeWatchlistDialog.emit()">
    <div class="watchlist-dialog">
      <div class="form-field">
        <label for="dashboard-watchlist-name-input">Watchlist name</label>
        <input
          id="dashboard-watchlist-name-input"
          type="text"
          [value]="watchlistNameDraft()"
          (input)="onWatchlistNameInput($event)"
          maxlength="20"
          placeholder="e.g. Recommendations"
        />
      </div>

      <div class="watchlist-dialog-actions">
        <button
          type="button"
          class="btn btn-primary"
          [disabled]="!canCreateWatchlist()"
          (click)="saveWatchlistName.emit()"
        >
          Save
        </button>
      </div>
    </div>
  </app-modal>
}

@if (watchlistDialogMode() === 'edit') {
  @if (activeWatchlistName(); as watchlistName) {
    <app-modal title="Edit Watchlist" (closed)="closeWatchlistDialog.emit()">
      <div class="watchlist-dialog">
        <div class="form-field">
          <label for="dashboard-watchlist-edit-name-input">Watchlist name</label>
          <input
            id="dashboard-watchlist-edit-name-input"
            type="text"
            [value]="watchlistNameDraft()"
            (input)="onWatchlistNameInput($event)"
            maxlength="20"
            placeholder="e.g. Recommendations"
          />
        </div>

        <div class="watchlist-dialog-actions">
          <button
            type="button"
            class="btn btn-secondary watchlist-delete-btn"
            [disabled]="!canDeleteActive()"
            (click)="confirmDeleteWatchlist.emit()"
          >
            Delete
          </button>
          <button type="button" class="btn btn-primary" (click)="saveWatchlistName.emit()">
            Save
          </button>
        </div>
      </div>
    </app-modal>
  }
}

@if (selectedWatchlistAsset(); as asset) {
  <app-asset-summary-overlay
    [asset]="asset"
    [title]="asset.name"
    (closed)="closeWatchlistAssetPopup.emit()"
  >
    <div class="watchlist-details-actions">
      <button
        type="button"
        class="btn btn-secondary watchlist-delete-btn"
        (click)="removeSelectedWatchlistAsset.emit()"
      >
        Remove
      </button>
      <button type="button" class="btn btn-primary" (click)="tradeSelectedWatchlistAsset.emit()">
        Trade
      </button>
    </div>
  </app-asset-summary-overlay>
}
