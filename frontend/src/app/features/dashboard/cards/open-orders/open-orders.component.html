<app-widget-card class="open-orders-card" title="Open Orders">
  <app-scrollable-list
    [items]="rows()"
    [trackBy]="trackById"
    [minHeight]="'325px'"
    [maxHeight]="'325px'"
    emptyMessage="No pending orders."
  >
    <ng-template let-row>
      <button type="button" class="open-order-row" (click)="openOrder(row)">
        <span class="order-date">{{ row.createdAt | date: 'MMM d, y' }}</span>

        @if (row.kind === 'trade') {
          <span
            class="order-type"
            [class.buy]="row.order.type === 'buy'"
            [class.sell]="row.order.type === 'sell'"
          >
            {{ row.order.type | titlecase }}
          </span>
          <span class="order-symbol">{{ row.order.symbol }}</span>
          <span class="order-method">{{ row.order.quantity }} {{ row.order.quantity === 1 ? "share" : "shares" }}</span>
        } @else {
          <span
            class="order-type"
            [class.deposit]="row.transaction.type === 'deposit'"
            [class.withdrawal]="row.transaction.type === 'withdrawal'"
            [class.exchange]="row.transaction.type === 'exchange'"
          >
            {{ formatLabel(row.transaction.type) }}
          </span>
          <span class="order-amount">{{
            row.transaction.amount | currency: row.transaction.currency ?? 'USD'
          }}</span>
          <span class="order-method">
            {{
              row.transaction.type === 'exchange'
                ? row.transaction.typeLabel
                : formatLabel(row.transaction.method)
            }}
          </span>
        }
      </button>
    </ng-template>
  </app-scrollable-list>
</app-widget-card>
