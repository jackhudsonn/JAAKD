<app-widget-card title="Performance" [status]="status()" (retry)="load()">
  @if (status() === 'idle' && summary(); as summary) {
    <div widget-actions class="value-summary">
      <span class="amount">{{ formatCurrency(summary.current, reportingCurrency) }}</span>
      <span class="change" [class]="trend()">
        {{ formatSignedUsd(summary.change) }}
        @if (summary.changePct !== null) {
          ({{ formatSignedPct(summary.changePct) }})
        }
      </span>
    </div>
  }

  @if (summary(); as summary) {
    <div class="performance-body">
      <app-line-chart
        [points]="chartPoints()"
        [trend]="trend()"
        [compact]="true"
        seriesLabel="Value"
        [referenceLines]="chartReferenceLines()"
      />

      <app-interval-selector
        [intervals]="intervals"
        [(selectedInterval)]="selectedInterval"
        ariaLabel="Time range"
      />
    </div>
  } @else {
    <p class="unavailable-note">No history yet.</p>
  }
</app-widget-card>
