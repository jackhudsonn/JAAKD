<main class="page-content">
  <!-- <h1>Trade</h1> -->

  <p class="page-description">Perform trades and view your orders.</p>

  @if (loadError()) {
    <div class="error-banner">
      <span>{{ loadError() }}</span>
      <button type="button" class="btn btn-secondary" (click)="dismissError()">Dismiss</button>
    </div>
  }

  <section class="trade-grid">
    <app-trade-card (selectSymbol)="openAsset($event, false)" />

    <app-holdings-card
      [holdings]="holdings()"
      [accountCash]="accountCash()"
      (selectSymbol)="openAsset($event, false)"
    />

    <app-orders-card
      class="orders-card-slot"
      [openOrders]="openOrders()"
      [historyOrders]="historyOrders()"
      (selectOrder)="openOrderDetails($event)"
    />
  </section>

  @if (activeAssetSymbol(); as symbol) {
    <app-asset-popup
      [symbol]="symbol"
      [showChart]="activeAssetShowChart()"
      [ownedQuantity]="activeAssetOwnedQuantity()"
      [accountCash]="accountCash()"
      (closed)="closeAssetPopup()"
      (orderPlaced)="placeOrder($event)"
    />
  }

  @if (activeOrder(); as order) {
    <app-order-details-popup
      [order]="order"
      (closed)="closeOrderPopup()"
      (cancel)="cancelOrder($event)"
    />
  }
</main>
