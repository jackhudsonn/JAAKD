<main class="page-content trade-page">
  <!-- <h1>Trade</h1> -->

  <p class="page-description">Perform trades and view your trade history.</p>

  @if (loadState() === 'loading') {
    <section class="trade-grid trade-grid-skeleton" aria-busy="true" aria-live="polite">
      <p class="sr-only">Loading trade data...</p>

      <article class="trade-skeleton-card">
        <div class="trade-skeleton-line trade-skeleton-line-sm"></div>
        <div class="trade-skeleton-line trade-skeleton-line-lg"></div>
        <div class="trade-skeleton-line trade-skeleton-line-md"></div>
        <div class="trade-skeleton-line trade-skeleton-line-lg"></div>
      </article>

      <article class="trade-skeleton-card">
        <div class="trade-skeleton-line trade-skeleton-line-sm"></div>
        <div class="trade-skeleton-line trade-skeleton-line-lg"></div>
        <div class="trade-skeleton-line trade-skeleton-line-lg"></div>
        <div class="trade-skeleton-line trade-skeleton-line-md"></div>
      </article>

      <article class="trade-skeleton-card trade-history-card-slot">
        <div class="trade-skeleton-line trade-skeleton-line-sm"></div>
        <div class="trade-skeleton-line trade-skeleton-line-lg"></div>
        <div class="trade-skeleton-line trade-skeleton-line-lg"></div>
        <div class="trade-skeleton-line trade-skeleton-line-md"></div>
        <div class="trade-skeleton-line trade-skeleton-line-lg"></div>
      </article>
    </section>
  } @else if (loadState() === 'error') {
    <p class="page-description">We couldn't load your trade data. Try again.</p>
    <button type="button" class="btn btn-secondary" (click)="retryLoad()">Retry</button>
  } @else {
    <section class="trade-grid">
      <app-trade-card (selectSymbol)="openAsset($event)" />

      <app-holdings-card
        [holdings]="holdings()"
        [cashBalances]="cashBalances()"
        (selectSymbol)="openAsset($event)"
      />

      <app-trade-history
        class="trade-history-card-slot"
        [orders]="orders()"
        (selectOrder)="openOrderDetails($event)"
      />
    </section>
  }

  @if (activeAssetSymbol(); as symbol) {
    <app-asset-popup
      [symbol]="symbol"
      [ownedQuantity]="activeAssetOwnedQuantity()"
      [accountCash]="accountCash()"
      [watchlists]="watchlistOptionsForActiveAsset()"
      [maxWatchlistHoldings]="maxWatchlistHoldings"
      (closed)="closeAssetPopup()"
      (orderPlaced)="placeOrder($event)"
      (setWatchlistMembership)="setWatchlistMembership($event)"
    />
  }

  @if (activeOrder(); as order) {
    <app-order-details-popup
      [order]="order"
      [history]="activeOrderHistory()"
      (closed)="closeOrderPopup()"
      (cancel)="cancelOrder($event)"
    />
  }
</main>
