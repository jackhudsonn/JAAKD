<app-widget-card class="trade-history-card" title="Trade History">
  <div class="trade-history-columns" role="row">
    <span class="column-label">Date</span>
    <span class="column-label">Type</span>
    <span class="column-label">Symbol</span>
    <span class="column-label">Qty</span>
    <span class="column-label">Status</span>
  </div>

  <app-scrollable-list
    [items]="rows()"
    [trackBy]="trackById"
    maxHeight="300px"
    emptyMessage="No trade history yet."
  >
    <ng-template let-row>
      <button type="button" class="trade-row" (click)="selectOrder.emit(row.order.id)">
        <span class="trade-date">{{ row.order.createdAt | date: 'MMM d, y' }}</span>
        <span
          class="trade-type"
          [class.buy]="row.order.type === 'buy'"
          [class.sell]="row.order.type === 'sell'"
        >
          {{ row.order.type | titlecase }}
        </span>
        <span class="trade-symbol">{{ row.order.symbol | displaySymbol }}</span>
        <span class="trade-quantity">{{ row.order.quantity }}</span>
        <app-status-badge [status]="row.order.status" />
      </button>
    </ng-template>
  </app-scrollable-list>
</app-widget-card>
