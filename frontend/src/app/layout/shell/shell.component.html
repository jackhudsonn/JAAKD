<div class="authenticated-shell">
  <app-navbar
    [isLoggedIn]="authService.isLoggedIn()"
    [userEmail]="userEmail()"
    [profileName]="displayName()"
    [canAccessAuditor]="canAccessAuditor()"
    (logoutClicked)="logout()"
  />
  <div class="market-ticker">
    <ng-template #tickerItems>
      @for (item of tickerLoopItems(); track $index) {
        <div class="ticker-item">
          <span class="ticker-symbol">
            {{ item.symbol }}
          </span>

          <span class="ticker-value">
            {{ item.price | number: '1.2-2' }}
          </span>

          @if (item.changePct === null) {
            <span class="ticker-change neutral">n/a</span>
          } @else {
            <span
              class="ticker-change"
              [class.positive]="item.changePct > 0"
              [class.negative]="item.changePct < 0"
              [class.neutral]="item.changePct === 0"
            >
              {{ formatChange(item.changePct) }}
            </span>
          }
        </div>
      }
    </ng-template>

    @if (tickerLoopItems().length > 0) {
      <div class="ticker-track" [style.--market-ticker-duration]="tickerDuration()">
        <div class="ticker-group">
          <ng-container [ngTemplateOutlet]="tickerItems" />
        </div>

        <div class="ticker-group" aria-hidden="true">
          <ng-container [ngTemplateOutlet]="tickerItems" />
        </div>
      </div>
    } @else if (tickerLoaded()) {
      <div class="ticker-item">
        <span class="ticker-symbol">Live prices unavailable</span>
      </div>
    }
  </div>

  <router-outlet />
</div>
