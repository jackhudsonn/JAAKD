<div class="authenticated-shell">
  <app-navbar
    [isLoggedIn]="authService.isLoggedIn()"
    [userEmail]="userEmail()"
    [profileName]="displayName()"
    [canAccessAuditor]="canAccessAuditor()"
    [canAccessAnalyst]="canAccessAnalyst()"
    [canAccessTrading]="canTrade()"
    [canAccessAdminTesting]="isAdmin()"
    (logoutClicked)="logout()"
  />
  <div class="market-ticker">
    <ng-template #tickerItems let-interactive>
      @for (item of tickerLoopItems(); track $index) {
        <button
          type="button"
          class="ticker-item"
          [attr.tabindex]="interactive ? null : -1"
          (click)="openTickerItem(item)"
        >
          <span class="ticker-symbol">
            {{ item.symbol }}
          </span>

          <span class="ticker-value">
            {{ formatCurrency(item.price, item.currency) }}
          </span>

          @if (item.changePct === null) {
            <span class="ticker-change neutral">n/a</span>
          } @else {
            <span
              class="ticker-change"
              [class.positive]="item.changePct > 0"
              [class.negative]="item.changePct < 0"
              [class.neutral]="item.changePct === 0"
            >
              {{ formatChange(item.changePct) }}
            </span>
          }
        </button>
      }
    </ng-template>

    @if (tickerLoopItems().length > 0) {
      <div class="ticker-track" [style.--market-ticker-duration]="tickerDuration()">
        <div class="ticker-group">
          <ng-container
            [ngTemplateOutlet]="tickerItems"
            [ngTemplateOutletContext]="{ $implicit: true }"
          />
        </div>

        <div class="ticker-group" aria-hidden="true">
          <ng-container
            [ngTemplateOutlet]="tickerItems"
            [ngTemplateOutletContext]="{ $implicit: false }"
          />
        </div>
      </div>
    } @else if (tickerLoaded()) {
      <div class="ticker-item">
        <span class="ticker-symbol">Live prices unavailable</span>
      </div>
    }
  </div>

  @if (selectedTickerItem(); as item) {
    <app-asset-summary-overlay [asset]="item" [title]="item.name" (closed)="closeTickerItem()">
      @if (canTrade()) {
        <div class="ticker-details-actions">
          <button type="button" class="btn btn-primary" (click)="openTradeForTickerItem()">
            Trade {{ item.symbol }}
          </button>
        </div>
      }
    </app-asset-summary-overlay>
  }

  <router-outlet />
</div>
